<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌸 ৩ পিস ঘর | অনলাইন ৩ পিস শপ</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#fff8fb;
  color:#29202a;
  line-height:1.6;
}

header{
  background:#d9366e;
  color:white;
  padding:16px 25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:25px;
  font-weight:bold;
}

.hero{
  text-align:center;
  padding:55px 20px 35px;
  background:linear-gradient(135deg,#ffe0eb,#fff);
}

.hero h1{
  color:#8f245c;
  font-size:32px;
  margin-bottom:8px;
}

.hero p{
  color:#76666e;
}

section{
  padding:40px 6%;
}

.title{
  text-align:center;
  color:#8f245c;
  font-size:28px;
  margin-bottom:30px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:22px;
}

.card{
  background:white;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 5px 20px #d8cbd1;
  border:1px solid #f1dce5;
}

.pic{
  height:260px;
  background:#fcecf3;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.pic img{
  width:100%;
  height:100%;
  object-fit:cover;
  cursor:pointer;
  transition:transform .25s;
}

.pic img:hover{
  transform:scale(1.03);
}

.emoji{
  font-size:90px;
}

.card-body{
  padding:18px;
}

.card-body h3{
  color:#8f245c;
  font-size:20px;
  margin-bottom:6px;
}

.price{
  color:#d9366e;
  font-size:21px;
  font-weight:bold;
  margin-bottom:12px;
}

.select-btn{
  width:100%;
  padding:11px;
  border:0;
  border-radius:10px;
  background:#d9366e;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.select-btn:hover{
  background:#b92559;
}

.cart{
  margin:20px 6%;
  background:#8f245c;
  color:white;
  padding:13px 20px;
  border-radius:12px;
  text-align:center;
  font-weight:bold;
}

.order{
  background:#fff;
  margin:30px 6%;
  padding:30px;
  border-radius:18px;
  box-shadow:0 5px 20px #ded2d7;
}

.order h2{
  text-align:center;
  color:#8f245c;
  margin-bottom:20px;
}

input,textarea,select{
  width:100%;
  padding:12px;
  margin-bottom:14px;
  border:1px solid #ddd;
  border-radius:9px;
  font-size:16px;
}

.order-btn{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#20b957;
  color:white;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

footer{
  background:#8f245c;
  color:white;
  text-align:center;
  padding:25px;
  margin-top:40px;
}

/* বড় ছবি দেখানোর popup */
.modal{
  display:none;
  position:fixed;
  z-index:999;
  left:0;
  top:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,.88);
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal img{
  max-width:95%;
  max-height:90%;
  object-fit:contain;
  border-radius:10px;
}

.close{
  position:absolute;
  top:15px;
  right:25px;
  color:white;
  font-size:42px;
  cursor:pointer;
  font-weight:bold;
}

@media(max-width:600px){
  .hero h1{
    font-size:26px;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .pic{
    height:190px;
  }

  .card-body{
    padding:12px;
  }

  .card-body h3{
    font-size:16px;
  }

  .price{
    font-size:18px;
  }

  .logo{
    font-size:20px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">🌸 ৩ পিস ঘর</div>
  <div>🛒 নির্বাচিত: <span id="count">0</span></div>
</header>

<div class="hero">
  <h1>আমাদের ৩ পিস কালেকশন</h1>
  <p>পছন্দের পোশাকটি বেছে নিয়ে হোয়াটসঅ্যাপে অর্ডার করুন</p>
</div>

<section>

<h2 class="title">✨ সুন্দর ৩ পিস কালেকশন ✨</h2>

<div class="grid" id="productGrid"></div>

</section>

<div class="cart">
  🛒 নির্বাচিত পণ্য: <span id="count2">0</span>
</div>

<div class="order">

<h2>📦 অর্ডার করুন</h2>

<select id="productSelect">
  <option value="">পণ্য নির্বাচন করুন</option>
</select>

<input id="name" type="text" placeholder="আপনার নাম">

<input id="phone" type="tel" placeholder="মোবাইল নম্বর">

<textarea id="address" rows="4" placeholder="সম্পূর্ণ ঠিকানা"></textarea>

<button class="order-btn" onclick="sendOrder()">
  📱 WhatsApp-এ অর্ডার করুন
</button>

</div>

<footer>
  <h3>🌸 ৩ পিস ঘর</h3>
  <p>অর্ডার ও যোগাযোগ: 01612999832</p>
  <p>© ২০২৬ ৩ পিস ঘর — সর্বস্বত্ব সংরক্ষিত</p>
</footer>

<!-- বড় ছবি দেখানোর popup -->
<div class="modal" id="imageModal" onclick="closeImage()">
  <span class="close">&times;</span>
  <img id="bigImage" src="" alt="বড় ছবি" onclick="event.stopPropagation()">
</div>

<script>

const products = [

{
  name:"ফুলের ডিজাইনের ৩ পিস",
  price:1290,
  emoji:"🌸",
  image:"WhatsApp Image 2026-08-25 at 3.01.36 AM.jpeg"
},

{
  name:"এলিগ্যান্ট কটন ৩ পিস",
  price:1490,
  emoji:"🌺"
},

{
  name:"প্রিমিয়াম প্রিন্টেড ৩ পিস",
  price:1690,
  emoji:"🔥"
},

{
  name:"উৎসব স্পেশাল ৩ পিস",
  price:1890,
  emoji:"💛"
},

{
  name:"আরামদায়ক লন ৩ পিস",
  price:1390,
  emoji:"🌷"
},

{
  name:"নতুন কালেকশন ৩ পিস",
  price:1590,
  emoji:"🌹"
}

];

const grid=document.getElementById("productGrid");
const select=document.getElementById("productSelect");

products.forEach((p,i)=>{

  let picture="";

  if(p.image){
    picture=
      `<img src="${p.image}"
       alt="${p.name}"
       onclick="openImage('${p.image}')">`;
  }else{
    picture=`<div class="emoji">${p.emoji}</div>`;
  }

  grid.innerHTML += `
    <div class="card">

      <div class="pic">
        ${picture}
      </div>

      <div class="card-body">

        <h3>${p.name}</h3>

        <div class="price">
          ৳ ${p.price.toLocaleString("bn-BD")}
        </div>

        <button class="select-btn"
          onclick="choose(${i})">
          🛒 নির্বাচন করুন
        </button>

      </div>

    </div>
  `;

  select.innerHTML += `
    <option value="${i}">
      ${p.name} — ৳ ${p.price}
    </option>
  `;

});


let count=0;

function choose(i){

  select.value=i;

  count++;

  document.getElementById("count").textContent=count;
  document.getElementById("count2").textContent=count;

  document.querySelector(".order")
    .scrollIntoView({
      behavior:"smooth"
    });
}


function openImage(src){

  document.getElementById("bigImage").src=src;

  document.getElementById("imageModal").style.display="flex";

}


function closeImage(){

  document.getElementById("imageModal").style.display="none";

  document.getElementById("bigImage").src="";

}


function sendOrder(){

  const name=document.getElementById("name").value.trim();
  const phone=document.getElementById("phone").value.trim();
  const address=document.getElementById("address").value.trim();

  const index=Number(select.value);

  if(!name || !phone || !address || select.value===""){
    alert("দয়া করে পণ্য, নাম, মোবাইল নম্বর ও ঠিকানা পূরণ করুন।");
    return;
  }

  const p=products[index];

  const msg=
`🌸 নতুন অর্ডার

পণ্যের নাম: ${p.name}
দাম: ৳${p.price}

ক্রেতার নাম: ${name}
মোবাইল: ${phone}
ঠিকানা: ${address}`;

  window.open(
    "https://wa.me/8801612999832?text="+encodeURIComponent(msg),
    "_blank"
  );

}

</script>

</body>
</html>
